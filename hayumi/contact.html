<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hayumi お問い合わせ</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
<h1>お問い合わせ</h1>
<p class="lead">入力した内容でメールを作り、メールアプリを開きます。このページから直接どこかに送られることはありません。</p>
<nav><a href="./">サポート</a><a href="./#faq-error">困った時</a><a href="./#faq-pro">Pro・お支払い</a></nav>

<div class="card">
<p><strong>先にこちらで解決できるかもしれません</strong></p>
<ul>
<li><a href="./#faq-error">エラーが出る・うまく動かない</a></li>
<li><a href="./#faq-pro">解約・プランの変更・返金・購入の復元</a></li>
<li><a href="./#faq-howto">使い方</a></li>
</ul>
</div>

<form id="contact" class="card" novalidate>
<label>お問い合わせの種類</label>
<div class="kinds" role="radiogroup" aria-label="お問い合わせの種類">
<input type="radio" name="kind" id="k-bug" value="不具合" checked><label for="k-bug">不具合・エラー</label>
<input type="radio" name="kind" id="k-howto" value="使い方"><label for="k-howto">使い方</label>
<input type="radio" name="kind" id="k-pro" value="課金・Pro"><label for="k-pro">課金・Pro</label>
<input type="radio" name="kind" id="k-request" value="ご要望"><label for="k-request">ご要望</label>
<input type="radio" name="kind" id="k-other" value="その他"><label for="k-other">その他</label>
</div>

<div class="bug-only" id="bug-fields">
<label for="what">何をした時に起きましたか<span class="hint">例：食事モードで、パノラマ3枚を選んで「写真に保存」を押した</span></label>
<textarea id="what"></textarea>

<label for="result">どうなりましたか<span class="hint">表示されたメッセージがあれば、そのまま書いてください。例：「写真を保存できませんでした」と出た</span></label>
<textarea id="result"></textarea>

<label for="often">どのくらい起きますか</label>
<select id="often">
<option value="">選んでください</option>
<option>毎回起きる</option>
<option>ときどき起きる</option>
<option>1回だけ起きた</option>
</select>

<label for="when">いつ頃から起きていますか<span class="hint">例：昨日から、アプリを更新してから</span></label>
<input type="text" id="when">
</div>

<label for="body" id="body-label">内容</label>
<textarea id="body"></textarea>

<label for="device">機種<span class="hint">「設定」→「一般」→「情報」の「機種名」。例：iPhone 17 Pro</span></label>
<input type="text" id="device">

<label for="ios">iOSの版<span class="hint">「設定」→「一般」→「情報」の「iOSバージョン」。例：26.1</span></label>
<input type="text" id="ios">

<label for="app">アプリの版<span class="hint">Hayumiの「設定」のいちばん下の「バージョン」。例：1.0.0（1）</span></label>
<input type="text" id="app">

<label for="plan">プラン</label>
<select id="plan">
<option value="">選んでください</option>
<option>無料</option>
<option>Pro（月額）</option>
<option>Pro（年額）</option>
<option>Pro（無料お試し中）</option>
<option>わからない</option>
</select>

<button type="submit">メールを作る</button>
<p class="note">メールアプリが開きます。内容を確かめて送信してください。<br>エラーの画面のスクリーンショットを添えていただくと、原因を早く調べられます（添えるかはご自由です）。<br>返信の目安：3営業日以内</p>
<button type="button" class="secondary" id="copy">メールアプリを使っていない場合（アドレスをコピー）</button>
<p class="note" id="copied" aria-live="polite"></p>
</form>

<footer>© itmnrg ・ <a href="privacy.html">プライバシーポリシー</a> ・ <a href="terms.html">利用規約</a></footer>
</main>
<script>
// 入力した内容から、件名と本文の入ったメールを作る（mailto）。どこにも送信しない
(function () {
  var address = "hayumi@home1.sakura.ne.jp";
  var form = document.getElementById("contact");
  var bugFields = document.getElementById("bug-fields");
  var bodyLabel = document.getElementById("body-label");

  function kind() {
    var checked = form.querySelector("input[name=kind]:checked");
    return checked ? checked.value : "その他";
  }
  function value(id) { return document.getElementById(id).value.trim(); }

  // 「不具合・エラー」の時だけ、調べるのに役立つ項目を出す
  function update() {
    var isBug = kind() === "不具合";
    bugFields.hidden = !isBug;
    bodyLabel.textContent = isBug ? "ほかに気づいたこと（あれば）" : "内容";
  }
  form.querySelectorAll("input[name=kind]").forEach(function (r) { r.addEventListener("change", update); });
  update();

  // 件名と本文の入った mailto の URL を作る（確かめやすいよう、送る処理とは分けておく）
  function buildMailto() {
    var lines = [];
    if (kind() === "不具合") {
      lines.push("【何をした時に起きたか】", value("what") || "（未記入）", "");
      lines.push("【どうなったか】", value("result") || "（未記入）", "");
      lines.push("【どのくらい起きるか】" + (value("often") || "（未記入）"));
      lines.push("【いつ頃から】" + (value("when") || "（未記入）"), "");
      if (value("body")) { lines.push("【ほかに気づいたこと】", value("body"), ""); }
    } else {
      lines.push("【内容】", value("body") || "", "");
    }
    lines.push("―― 端末の情報 ――");
    lines.push("機種：" + (value("device") || "（未記入）"));
    lines.push("iOS：" + (value("ios") || "（未記入）"));
    lines.push("アプリ：Hayumi " + (value("app") || "（未記入）"));
    lines.push("プラン：" + (value("plan") || "（未記入）"));
    var subject = "[Hayumi] " + kind();
    return "mailto:" + address +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(lines.join("\n"));
  }
  window.hayumiBuildMailto = buildMailto;

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    location.href = buildMailto();
  });

  document.getElementById("copy").addEventListener("click", function () {
    var done = document.getElementById("copied");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(address).then(function () {
        done.textContent = "コピーしました：" + address;
      }, function () { done.textContent = address; });
    } else {
      done.textContent = address;
    }
  });
})();
</script>
</body>
</html>
